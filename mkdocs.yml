site_name: A2A Protocol Learning
site_url: https://mbaneshi.github.io/a2a-learning/
site_author: Mehdi Baneshi
site_description: Comprehensive learning materials for mastering the Agent2Agent (A2A) protocol

repo_name: mbaneshi/a2a-learning
repo_url: https://github.com/mbaneshi/a2a-learning

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Learning Path:
    - Introduction: introduction.md
    - Protocol Specification: protocol-specification.md
    - Client Implementation: client-implementation.md
    - Server Implementation: server-implementation.md
    - Agent Integration: agent-integration.md
    - Examples: examples.md
    - Best Practices: best-practices.md
  - About: about.md

plugins:
  - search
